<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Dispositivo IoT</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { color: #333; }
        form { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 4px; }
        input[type="submit"] { background-color: #28a745; color: white; padding: 10px 20px;
            border: none; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background-color: #218838; }
        .back-link { margin-top: 20px; display: block; color: #007bff; }
        .error-message { color: red; background-color: #ffe6e6; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Agregar Nuevo Dispositivo IoT</h2>

    <% if (session.getAttribute("errorMessage") != null) { %>
    <div class="error-message">
        <%= session.getAttribute("errorMessage") %>
        <% session.removeAttribute("errorMessage"); %>
    </div>
    <% } %>

    <form action="addDevice" method="post">
        <label for="nombre">Nombre del dispositivo:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="serialNumber">Número de serie (mínimo 5 caracteres):</label>
        <input type="text" id="serialNumber" name="serialNumber" required minlength="5">

        <label for="ubicacion">Ubicación:</label>
        <input type="text" id="ubicacion" name="ubicacion" required>

        <label for="tipo">Tipo de dispositivo:</label>
        <input type="text" id="tipo" name="tipo" required>

        <label for="estate">Estado inicial:</label>
        <select id="estate" name="estate">
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE" selected>INACTIVE</option>
        </select>

        <input type="submit" value="Registrar Dispositivo">
    </form>
    <a href="index.html" class="back-link">← Volver al inicio</a>
</div>
</body>
</html>
