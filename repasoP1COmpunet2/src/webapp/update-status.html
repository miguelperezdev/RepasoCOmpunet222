<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Estado del Dispositivo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { color: #333; }
        form { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 8px; margin-bottom: 15px;
                                        border: 1px solid #ddd; border-radius: 4px; }
        input[type="submit"] { background-color: #ffc107; color: #333; padding: 10px 20px;
                               border: none; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background-color: #e0a800; }
        .back-link { margin-top: 20px; display: block; color: #007bff; }
        .error-message { color: red; background-color: #ffe6e6; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Actualizar Estado del Dispositivo</h2>

        <% if (session.getAttribute("errorMessage") != null) { %>
            <div class="error-message">
                <%= session.getAttribute("errorMessage") %>
                <% session.removeAttribute("errorMessage"); %>
            </div>
        <% } %>

        <form action="updateStatus" method="post">
            <label for="id">ID del dispositivo:</label>
            <input type="number" id="id" name="id" required placeholder="Ej: 1, 2, 3...">

            <label for="estate">Nuevo estado:</label>
            <select id="estate" name="estate">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
            </select>

            <input type="submit" value="Actualizar Estado">
        </form>
        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>
</body>
</html>
